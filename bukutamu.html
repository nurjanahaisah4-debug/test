<center>
    <h1><font color="#2B8A78">✿ Buku Tamu</font></h1>

    <p>
        Silahkan isi pendapat kamu mengenai kesan dan pesan untuk website ini melalui form berikut.
    </p>

    <form>

        <table border="1" cellpadding="10"
               cellspacing="0"
               bordercolor="#AEEBDD"
               bgcolor="white">

            <tr>
                <td><b>Nama</b></td>
                <td>
                    <input type="text" name="nama">
                </td>
            </tr>

            <tr>
                <td><b>Email</b></td>
                <td>
                    <input type="email" name="email">
                </td>
            </tr>

            <tr>
                <td><b>Jenis Kelamin</b></td>
                <td>
                    <input type="radio"
                           name="jenis_kelamin"
                           value="Laki-laki">
                    Laki-laki

                    <br>

                    <input type="radio"
                           name="jenis_kelamin"
                           value="Perempuan">
                    Perempuan
                </td>
            </tr>

            <tr>
                <td><b>Pesan/Kesan</b></td>
                <td>
                    <textarea name="pesan"
                              rows="7"
                              cols="40"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Kirim">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>
</center>
